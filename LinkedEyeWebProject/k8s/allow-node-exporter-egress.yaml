# Allows the UI / Prometheus / monitor pods to reach node_exporter (TCP 9100)
# on the device subnets. Without this egress rule the mgmt-addon TCP check and
# Prometheus scrapes to 192.168.152.0/24 and 192.168.252.0/24 are blocked, which
# surfaced as "TCP check failed" during device onboarding.
#
# Apply with: kubectl apply -f allow-node-exporter-egress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-exporter-egress
  namespace: fs-linkedeye
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - ui
          - prometheus
          - monitor
          - prom-node-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.152.0/24
        - ipBlock:
            cidr: 192.168.252.0/24
      ports:
        - protocol: TCP
          port: 9100
