<style>
/* ── CSS variables ── */
:root {
    --bod-bg: #121212;
    --bod-card: #1f1f1f;
    --bod-card2: #1a1a1a;
    --bod-border: #2a2a2a;
    --bod-accent: #e99123;
    --bod-accent-dim: rgba(233,145,35,0.15);
    --bod-accent-glow: rgba(233,145,35,0.08);
    --bod-text: #e0e0e0;
    --bod-text-muted: #999;
    --bod-green: #4caf50;
    --bod-green-dim: rgba(76,175,80,0.12);
    --bod-topbar-h: 48px;
}

/* ── Top bar ── */
.bod-topbar {
    height: var(--bod-topbar-h);
    background: var(--bod-card);
    border-bottom: 1px solid var(--bod-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.bod-breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--bod-text-muted);
}
.bod-breadcrumb .bc-site  { color: var(--bod-text); font-weight: 600; }
.bod-breadcrumb .bc-sep   { color: #555; }
.bod-breadcrumb .bc-page  { color: var(--bod-text); }
.bod-breadcrumb .bc-sub   { color: var(--bod-accent); font-weight: 600; }
.bod-topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}

/* ── Live toggle ── */
.bod-live-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 6px;
    background: var(--bod-green-dim);
    border: 1px solid rgba(76,175,80,0.25);
    font-size: 12px;
    color: var(--bod-green);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
}
.bod-live-toggle .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--bod-green);
    animation: bodLivePulse 1.5s infinite;
    flex-shrink: 0;
}
.bod-live-toggle.paused { background: var(--bod-card2); border-color: var(--bod-border); color: var(--bod-text-muted); }
.bod-live-toggle.paused .dot { background: var(--bod-text-muted); animation: none; }
@keyframes bodLivePulse {
    0%   { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
    70%  { box-shadow: 0 0 0 6px rgba(76,175,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
}

/* ── Export button ── */
.bod-btn-export {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid rgba(233,145,35,0.25);
    background: var(--bod-accent-dim);
    color: var(--bod-accent);
    cursor: pointer;
    transition: all 0.15s ease;
}
.bod-btn-export:hover { border-color: var(--bod-accent); }

/* ── WebSocket icon — exact copy of APM #adp-pipe ── */
#bodeod-pipe.indicator {
    width: 38px; height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bod-card2);
    border: 1px solid var(--bod-border);
    margin-left: 10px;
    color: var(--bod-text-muted);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    cursor: pointer;
}
#bodeod-pipe.indicator:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2), 0 4px 6px -2px rgba(0,0,0,0.1);
    border-color: rgba(255,255,255,0.1);
    background: var(--bod-card);
}
/* Fix Bootstrap tooltip opacity override */
#bodeod-pipe .tooltip {
    opacity: 1 !important;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%; height: 100%;
}
#bodeod-pipe i { font-size: 22px; cursor: pointer; color: inherit; transition: transform 0.2s; }
#bodeod-pipe:hover i { transform: scale(1.1); }

/* Premium tooltip — exact APM match */
#bodeod-pipe .tooltiptext {
    visibility: hidden;
    min-width: 220px;
    background: rgba(30, 30, 34, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--bod-text);
    text-align: left;
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    position: absolute;
    z-index: 1000;
    top: 52px;
    right: 0;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 16px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
    opacity: 0;
    transform: translateY(10px) scale(0.95);
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow: hidden !important;
    pointer-events: none;
}
#bodeod-pipe:hover .tooltiptext,
#bodeod-pipe .tooltiptext.shown {
    visibility: visible;
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}
/* QUEUE NAME row */
#bodeod-pipe .tooltiptext p {
    margin: 0;
    padding: 6px 0;
    font-size: 13px;
    color: var(--bod-text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
#bodeod-pipe .tooltiptext p b {
    color: var(--bod-accent);
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-size: 11px;
}
/* isConnected table */
#bodeod-pipe .tooltiptext table {
    width: 100% !important;
    margin: 4px 0 !important;
    border-collapse: collapse !important;
    background: transparent !important;
}
/* Neutralise Bootstrap row/col leaking */
#bodeod-pipe .tooltiptext .tooltiping,
#bodeod-pipe .tooltiptext .row {
    display: flex !important;
    flex-direction: column !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
}
#bodeod-pipe .tooltiptext table tbody.row { width: 100% !important; }
#bodeod-pipe .tooltiptext table tr.col-12 {
    display: flex !important;
    flex-direction: row !important;
    justify-content: space-between !important;
    align-items: center !important;
    padding: 6px 0 !important;
    border-bottom: 1px solid rgba(255,255,255,0.05) !important;
    width: 100% !important;
    flex-wrap: nowrap !important;
    background: transparent !important;
}
#bodeod-pipe .tooltiptext table td {
    background: transparent !important;
    border: none !important;
}
#bodeod-pipe .tooltiptext table td.details_td {
    color: var(--bod-text) !important;
    font-weight: 500 !important;
    font-size: 12px !important;
    display: flex !important;
    align-items: center !important;
    width: auto !important;
    padding: 0 !important;
    white-space: nowrap !important;
}
#bodeod-pipe .tooltiptext table td.details_ts {
    font-family: 'Consolas', 'Courier New', monospace !important;
    font-size: 12px !important;
    font-weight: bold !important;
    text-align: right !important;
    width: auto !important;
    padding: 0 !important;
    white-space: nowrap !important;
}
/* Lastconnect line */
#bodeod-pipe .tooltiptext .tooltiptexting {
    display: block !important;
    width: 100% !important;
    text-align: left !important;
    font-size: 11px !important;
    color: var(--bod-text-muted) !important;
    padding: 8px 0 0 0 !important;
    border-bottom: none !important;
    font-family: 'Consolas', 'Courier New', monospace !important;
    line-height: 1.4 !important;
    background-color: transparent !important;
    position: relative !important;
    visibility: visible !important;
    box-shadow: none !important;
    top: auto !important;
    right: auto !important;
}

/* ── Key tab bar (K8S_SSL_Expiry, URLChecker…) ── */
.bod-subnav {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 0;
    padding: 0 20px;
    border-bottom: 1px solid var(--bod-border);
    background: var(--bod-card);
    list-style: none;
    margin: 0;
    scrollbar-width: thin;
}
.bod-subnav::-webkit-scrollbar { height: 3px; }
.bod-subnav::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.bod-subnav li { flex-shrink: 0; }
.bod-subnav a {
    display: inline-block;
    color: #999;
    text-decoration: none !important;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 16px;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    cursor: pointer;
    white-space: nowrap;
}
.bod-subnav a:hover { color: var(--bod-accent); background: var(--bod-accent-glow); text-decoration: none !important; }
.bod-subnav a.bod-tab-active {
    color: var(--bod-accent) !important;
    border-bottom: 1px solid transparent;
    border-left: 2px solid var(--bod-accent);
    background: var(--bod-card2);
    padding-left: 14px;
}
.bod-subnav a.status-red    { color: #ff5252 !important; }
.bod-subnav a.status-orange { color: #ffb347 !important; }
.bod-subnav a.status-green  { color: #4caf50 !important; }
.bod-subnav a.status-red.bod-tab-active    { border-left-color: #ff5252; }
.bod-subnav a.status-orange.bod-tab-active { border-left-color: #ffb347; }
.bod-subnav a.status-green.bod-tab-active  { border-left-color: #4caf50; }

/* ── Tab content panels ── */
.bod-tab-content { padding: 0; }
.bod-tab-panel   { display: none; padding: 12px 20px; }

/* ── Snackbar ── */
.snackbar, .snackbars { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; }

/* ── No-data / Loader ── */
#bod-eodstatus-nodata { display: none; padding: 40px 20px; text-align: center; }

/* ── Subsite pill tab bar (LE, VACHANA, VERTEX…) ── */
.bod-subsite-nav {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 6px;
    list-style: none;
    margin: 0;
    padding: 8px 20px;
    background: var(--bod-card);
    border-bottom: 1px solid var(--bod-border);
    scrollbar-width: thin;
}
.bod-subsite-nav::-webkit-scrollbar { height: 3px; }
.bod-subsite-nav::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.bod-subsite-nav .nav-item { flex-shrink: 0; list-style: none; }
.bod-subsite-nav .nav-link {
    display: inline-block;
    padding: 5px 16px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    border: 1px solid var(--bod-border);
    background: var(--bod-card2);
    color: var(--bod-text-muted);
    cursor: pointer;
    text-decoration: none !important;
    transition: all 0.2s ease;
    white-space: nowrap;
    letter-spacing: 0.3px;
}
.bod-subsite-nav .nav-link:hover { border-color: var(--bod-accent); background: var(--bod-accent-glow); color: var(--bod-text); text-decoration: none !important; }
.bod-subsite-nav .nav-link.active {
    background: var(--bod-accent) !important;
    border-color: var(--bod-accent) !important;
    color: #fff !important;
    box-shadow: 0 4px 12px rgba(233,145,35,0.25);
}
.bod-subsite-nav .nav-link.status-red    { color: #ff5252 !important; }
.bod-subsite-nav .nav-link.status-orange { color: #ffb347 !important; }
.bod-subsite-nav .nav-link.status-green  { color: #4caf50 !important; }
.bod-subsite-nav .nav-link.active.status-red    { color: #fff !important; }
.bod-subsite-nav .nav-link.active.status-orange { color: #fff !important; }
.bod-subsite-nav .nav-link.active.status-green  { color: #fff !important; }

/* ── Table / legacy styles ── */
.dataTables_wrapper .dataTables_filter,
.dataTables_wrapper .dataTables_filter input { color: grey !important; }
.paginate_button { color: white !important; }
.modal-dialog { width: auto; max-width: 85%; }
.dt-button { border: 2px solid #e99123; border-radius: 10px; background-color: #121212; color: gray; }
.red   { color: #ff3d57 !important; }
.green { color: #16d39a !important; }
.orange{ color: #e99123 !important; }
.blue  { color: #0000cd !important; }
.tr-rowclr, .text-uppercase { font-size: 12px; }
</style>
</head>

<body style="background:#121212; margin:0; padding:0;">

<!-- TOP BAR -->
<div class="bod-topbar">
    <div class="bod-breadcrumb">
        <span class="bc-site" id="bod-site-name"></span>
        <span class="bc-sep">&gt;</span>

    </div>
    <div class="bod-topbar-actions">
        <div class="bod-live-toggle" id="bod-live-btn" onclick="bodToggleLive()">
            <span class="dot"></span>

        </div>

            <i data-feather="file-text" style="width:14px;height:14px;"></i> Export
        </button>

        <div id="bod-eodstatus-expand" style="display:none;">
            <input type="checkbox" id="expand" onchange="clickOnAll(this)" />

    </div>
</div>

    <div class="snackbar"  id="snackbar"  style="text-align:center;"></div>
    <div class="snackbars" id="snackbars" style="text-align:center;"></div>
</div>

<!-- MAIN CONTENT -->
<div id="bod-eodstatus">
    <div id="bod-eodstatus-nodata">
        <div class="error-tryagain">
            <div class="icon-img mb-2"><i class="icon-error size30"></i></div>
            <p class="size12 mb-2 primary-text" id="nodatamessage"></p>
        </div>
    </div>
    <div class="bod-tab-content" id="site-data" style="display:none;"></div>
    <div id="loader" style="display:none; text-align:center; padding:40px;">
        <img src="{% static 'app/images/loading-gif.gif' %}" style="width:50px;" />
    </div>
    <ul id="site-list" style="display:none;"></ul>
</div>

<!-- MODALS -->
<div class="modal fade" id="dialog-for-content">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="card-header heading">
                <div class="row">
                    <div class="col-6"><h6 class="card-title">Logs</h6></div>
                    <div class="col-6"><button type="button" class="close dismiss-btn" data-dismiss="modal">&times;</button></div>
                </div>
            </div>
            <div class="card-body size14 px-2 py-3 contarea ch-500"
                 style="min-height:300px;max-height:500px;word-wrap:break-word;white-space:pre-wrap;"
                 id="file_content"></div>
            <div class="no-data grey-text text-center pt-4" id="nodata" style="visibility:hidden;">
                <div class="pt-4">
                    <div class="error-tryagain">
                        <div class="icon-img mb-2"><i class="icon-error size30"></i></div>
                        <p class="size16 mb-2 primary-text" id="nodatamessage"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="dialog-for-addcomment">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <p class="modal-title row col-12">Add comment</p>
                <button type="button" class="btn close dismiss-btn" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body" style="padding-top:0;padding-bottom:0;">
                <div class="col-12 px-md-1 px-0 mx-auto">
                    <div class="col-12 my-4">
                        <label for="frominput">Comment to add:</label>
                        <input type="text" class="form-control notification_input_effect full-input"
                               placeholder="Enter your comment" required id="syntax" autocomplete="off">
                        <span class="error-msg"></span>
                    </div>
                    <div id="extrainputfield" style="display:none;">
                        <div class="col-12 my-4">
                            <label for="frominput" id="fullsyntax_label">Full Syntax</label>
                            <input type="text" name="input" class="form-control full-input notification_input_effect"
                                   autocomplete="off" id="fullsyntax" required placeholder="Enter Comment" />
                            <span class="error-msg" id="fullsyntax-error-msg"></span>

                    </div>
                </div>
            </div>
            <div class="modal-footer mx-auto col-md-11 col-12">
                <div class="col-6 px-1">
                    <button type="button" class="btn btn-outline-secondary cancel-btn w-100" data-dismiss="modal">Cancel</button>
                </div>
                <div class="col-5 px-1">
                    <button type="button" class="btn btn-outline-secondary w-100" id="addbtn" onclick="addComment()">Add</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="dialog-for-showcomments">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <p class="modal-title"><h3 style="font-weight:bold">Comments:</h3></p>
                <button type="button" class="btn close dismiss-btn" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body py-1"></div>
        </div>
    </div>
</div>

<script>
    var csfr_token  = '{{csrf_token}}';
    var pageName    = "BOD-EODStatus";
    var websocketurl = '{{ websocketurl }}';

    function GetURLParameter(sParam) {
        var sPageURL = window.location.search.substring(1);
        var sURLVariables = sPageURL.split('&');
        for (var i = 0; i < sURLVariables.length; i++) {
            var sParameterName = sURLVariables[i].split('=');
            if (sParameterName[0] == sParam) return sParameterName[1];
        }
    }
    var siteName = GetURLParameter('site');
    var bodURL   = '/bod-eodstatus?sites=' + siteName;

    $(document).ready(function () {
        if (siteName) $('#bod-site-name').text(siteName);
    });

    var _bodLiveActive = true;
    function bodToggleLive() {
        _bodLiveActive = !_bodLiveActive;
        var btn  = document.getElementById('bod-live-btn');
        var text = document.getElementById('bod-live-text');
        if (_bodLiveActive) {
            btn.classList.remove('paused');
            text.textContent = 'Live';
            var oldBtn = document.getElementById('plps-btn');
            if (oldBtn && oldBtn.classList.contains('paused')) oldBtn.click();
            else refreshBODEOD();
        } else {
            btn.classList.add('paused');
            text.textContent = 'Paused';
            var oldBtn = document.getElementById('plps-btn');
            if (oldBtn && !oldBtn.classList.contains('paused')) oldBtn.click();
        }
    }
</script>

<!-- Hidden legacy play/pause (kept for JS compatibility) -->
<div style="display:none;">
    <div class="playpause-div">
        <div id="plps-text">Live Update</div>
        <button class="playpause" id="plps-btn"></button>
    </div>
</div>

</body>
</html>
