<style>
    #india-map {
        height: 900px;
    }

    #site-list {
        -ms-overflow-style: scrollbar;
    }

    #information_modal {
        z-index: 999;
    }

    .jvectormap-marker {
        width: 20px !important;
        height: 20px !important;
    }
    /* #add-site-data thead tr th {
      width:2%;
    }
    #add-site-data thead tr th:first-child {
      width:5%;
    }*/
    #add-site-data tbody tr:nth-child(odd) {
        background-color: #101010 !important;
    }

    @media screen and (max-width: 768px) {
        #india-map {
            height: 300px;
        }

        #map, #availablesites {
            max-width: 55% !important;
        }

        #site-list, #asite-list {
            width: 55% !important;
        }
    }

    #map {
        background: #a33219;
        font-size: 17px;
        color: white;
        border-radius: 3px;
        max-width: 12%;
        text-align: center
    }

    #availablesites {
        background: #a99123;
        font-size: 17px;
        color: white;
        border-radius: 3px;
        min-width: 9%;
        max-width: 12%;
        text-align: center
    }

    #site-list {
        position: absolute;
        min-width: 15%;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 5;
        overflow-y: scroll;
        text-align: -webkit-right
    }

    #asite-list {
        position: absolute;
        min-width: 15%;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 5;
        overflow-y: scroll;
        text-align: -webkit-right
    }

    #map:hover #site-list {
        display: block !important;
        background-color: #1f1f1f
    }

    #dropdown {
        text-align: -webkit-right;
    }

    .show-modal {
        display: block;
    }
</style>
