<style>

    .paginate_button {
        color: white;
    }

    .tooltip {
        position: relative;
        display: inline-block;
        /*border-bottom: 1px dotted black;*/
    }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 255px !important;
            background-color: #121212;
            color: #fff;
            font-size: 2px;
            text-align: left;
            /*border-radius: 10px;
            box-shadow: 1px 2px #aab2bd;*/
            padding: 5px 5px;
            line-height: 100%;
            /* Position the tooltip */
            position: absolute;
            z-index: 1;
            top: 70%;
            right: 500%;
            height: 160%;
            border: 1px solid #e99123;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
        }

    .tooltiping {
        position: relative;
        display: flex;
        border-bottom: 1px dotted black;
    }

        .tooltiping .tooltiptexting {
            visibility: hidden;
            width: 70%;
            background-color: #121212;
            color: #fff;
            font-size: 12px;
            text-align: left;
            /*border-radius: 10px;*/
            box-shadow: 1px 2px #aab2bd;
            padding: 5px 0;
            line-height: 100%;
            /* Position the tooltip */
            position: absolute;
            z-index: 1;
            top: 75%;
            right: 25%;
        }

        .tooltiping:hover .tooltiptexting {
            visibility: visible;
        }
</style>

<script>

    function GetURLParameter(sParam) {
        var sPageURL = window.location.search.substring(1);
        var sURLVariables = sPageURL.split('&');
        for (var i = 0; i < sURLVariables.length; i++) {
            var sParameterName = sURLVariables[i].split('=');
            if (sParameterName[0] == sParam) {
                return sParameterName[1];
            }
        }
    }

    var siteName = GetURLParameter('site');
    var eodURL = '/eod-eodstatus?sites=' + siteName
    //var bodURL = '/bod-eodstatus?sites=fs-uat-asp-ifsc1'

</script>
