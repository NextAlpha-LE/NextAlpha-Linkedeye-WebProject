<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Linkedeye</title>
</head>
<body style="margin:0;padding:0;font-family:Arial, Helvetica, sans-serif;">
    <table cellpadding="0" cellspacing="0" width="100%" style="border:none;color:#4b4b4b">
        <tr>
            <td style="padding:16px;">
                <table style="text-align:center;align-items: center; border:1px solid #eaeaea;border-collapse:collapse; width: 100%;" cellpadding="0" cellspacing="0">
                    <tr>
                        <td style="padding:30px 30px 30px 30px">
                            <table cellpadding="0" cellspacing="0" width="100%">
                                <tbody style="text-align: left; font-size:14px;">
                                    <tr>
                                        <td style="padding:16px 0px;">Hi {{name}},</td>
                                    </tr>
                                    <tr>
                                        <td style=" padding:12px 0px;">Welcome to Linkedeye.</td>
                                    </tr>
                                    <tr>
                                        <td style="padding-bottom: 24px;">Congratulations! you have sucessfully registered on Linkedeye.</td>
                                    </tr>
                                    <tr>
                                        <td style="padding-bottom: 24px;">You can now login to our site at 
                                          <a href="{{url}}"> Login</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="line-height:22px">The username and password to login is as follow:</td>
                                    </tr>
                                    <tr>
                                        <td style="line-height:22px">Username: {{username}}</td>
                                    </tr>
                                    <tr>
                                        <td style="line-height:22px">Password: {{password}}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:14px;padding: 30px 30px 6px 30px; text-align: left;">Thanks,</td>
                    </tr>
                    <tr>
                        <td style="font-size:14px; padding: 0px 30px 30px 30px; text-align: left;">Team Linkedeye.</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
   
</body>
</html>
