# LinkedEye Web Application Deployment
# CRITICAL FIX #2: K8s memory limits + restart policy + health probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedeye-web
  namespace: fs-linkedeye
  labels:
    app: linkedeye-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkedeye-web
  template:
    metadata:
      labels:
        app: linkedeye-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics/"
    spec:
      containers:
        - name: linkedeye-web
          image: registry.gitlab.com/finspot-prod/finspot-images/linkedeyewebproject:latest
          ports:
            - containerPort: 8000
              protocol: TCP

          # CRITICAL: Resource limits prevent OOM node kills
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "2000m"

          # Liveness: restart if process is dead
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          # Readiness: remove from service if unhealthy
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

          # Startup: give container time to initialize (migrations, vault, etc.)
          startupProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          env:
            - name: GUNICORN_WORKERS
              value: "4"
            - name: MYSQL_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedeye-config
                  key: MYSQL_DB_HOST
            - name: MYSQL_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkedeye-config
                  key: MYSQL_DB_PORT
            - name: MYSQL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: linkedeye-secrets
                  key: MYSQL_DB_USER
            - name: MYSQL_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: linkedeye-secrets
                  key: MYSQL_DB_PASS
            - name: NEO4J_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkedeye-config
                  key: NEO4J_HOST
            - name: NEO4J_PASS
              valueFrom:
                secretKeyRef:
                  name: linkedeye-secrets
                  key: NEO4J_PASS
            - name: REDIS_CACHE_URL
              valueFrom:
                configMapKeyRef:
                  name: linkedeye-config
                  key: REDIS_CACHE_URL
            - name: LINKEDEYE_EMAIL_APPKEY
              valueFrom:
                secretKeyRef:
                  name: linkedeye-secrets
                  key: LINKEDEYE_EMAIL_APPKEY

          volumeMounts:
            - name: vault-keys
              mountPath: /vault
            - name: monitor-data
              mountPath: /usr/src/monitor
            - name: logs
              mountPath: /usr/src/static/logs

      volumes:
        - name: vault-keys
          persistentVolumeClaim:
            claimName: linkedeye-vault-pvc
        - name: monitor-data
          persistentVolumeClaim:
            claimName: linkedeye-monitor-pvc
        - name: logs
          emptyDir: {}

      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: linkedeye-web
  namespace: fs-linkedeye
spec:
  selector:
    app: linkedeye-web
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
