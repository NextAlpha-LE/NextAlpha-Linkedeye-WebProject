# LinkedEye Horizontal Pod Autoscaler
# MEDIUM FIX #26: Auto-scale during market hours (09:00-15:30 IST)
# Scale 2-5 pods based on CPU/memory utilization
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: linkedeye-web-hpa
  namespace: fs-linkedeye
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: linkedeye-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
